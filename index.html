<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>EditorTs Editor</title>
	<link rel="stylesheet" href="./src/styles/branding.css" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: var(--font-main);
			height: 100vh;
			overflow: hidden;
		}

		.editor-container {
			display: flex;
			height: 100vh;
		}

		.sidebar {
			width: 300px;
			background: var(--color-sidemenu-bg);
			border-right: 1px solid var(--color-primary-border);
			padding: 1.5rem;
			overflow-y: auto;
		}

		.sidebar h2 {
			font-family: var(--font-secondary);
			margin-bottom: 1rem;
			font-size: 1.25rem;
		}

		.sidebar h3 {
			font-size: 0.9rem;
			margin: 1rem 0 0.5rem 0;
			color: var(--color-editor-light-text);
		}

		.stats-section {
			background: white;
			padding: 1rem;
			border-radius: 6px;
			margin-bottom: 1rem;
			box-shadow: var(--shadow-sm);
		}

		.selected-section {
			background: white;
			padding: 1rem;
			border-radius: 6px;
			box-shadow: var(--shadow-sm);
			display: none;
		}

		.selected-section.active {
			display: block;
		}

		.layers-section {
			background: white;
			padding: 1rem;
			border-radius: 6px;
			margin-bottom: 1rem;
			box-shadow: var(--shadow-sm);
			max-height: 400px;
			overflow-y: auto;
		}

		.canvas-container {
			flex: 1;
			padding: 2rem;
			background: var(--color-editor-light-bg);
			overflow: auto;
		}

		.preview-frame {
			width: 100%;
			height: 100%;
			border: none;
			background: white;
			border-radius: 8px;
			box-shadow: var(--shadow-lg);
		}

		.save-button {
			position: fixed;
			bottom: 2rem;
			right: 2rem;
			padding: 1rem 2rem;
			background: var(--color-editor-light-text);
			color: white;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			font-family: var(--font-main);
			font-weight: 500;
			box-shadow: var(--shadow-lg);
			z-index: 1000;
			transition: transform 0.2s;
		}

		.save-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
		}
	</style>
</head>

<body>
	<!-- User controls the entire layout -->
	<div class="editor-container">
		<!-- Sidebar (optional) -->
		<div class="sidebar">
			<h2>EditorTs Editor</h2>

			<!-- Stats container -->
			<div class="stats-section">
				<h3>Page Stats</h3>
				<div id="stats-container"></div>
			</div>

			<!-- Layer panel - component hierarchy -->
			<div class="layers-section">
				<h3>Layers</h3>
				<div id="layers-container"></div>
			</div>

			<!-- Selected component info -->
			<div id="selected-container" class="selected-section">
				<h3>Selected Component</h3>
				<div id="selected-info"></div>
			</div>
		</div>

		<!-- Canvas container -->
		<div class="canvas-container">
			<!-- The iframe where the template renders -->
			<iframe id="preview-iframe" class="preview-frame"></iframe>
		</div>
	</div>


	<!-- Initialize editor -->
	<script type="module" src="./examples/quickstart.ts"></script>
</body>

</html>
